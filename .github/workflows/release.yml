# Release: on a version tag (vX.Y.Z), build the universal macOS app, sign it with
# DigitalTolk's Developer ID, notarize + staple the app and the DMG, publish the
# GitHub release, and ask DigitalTolk/homebrew-tools to open its cask-update PR.
# In parallel, build the Linux x86_64 AppImage / .deb / .rpm; once the macOS release is
# published they are added to it, and their platforms to its latest.json (in-app updates).
#
# Same steps as a local release (scripts/release-macos.sh + scripts/publish-homebrew.sh,
# scripts/release-linux.sh + scripts/publish-linux.sh).
#
# Secrets (repository or organisation level; same names as DigitalTolk/ex-electron):
#   MAC_CSC_LINK                  base64 of the Developer ID Application .p12
#   MAC_CSC_KEY_PASSWORD          password of that .p12
#   APPLE_ID                      Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password of that Apple ID
#   APPLE_TEAM_ID                 H8S8C5U3W2
#   TAURI_SIGNING_PRIVATE_KEY     (optional) updater signing key; without it no updater artifacts
#                                 (macOS and Linux)
#   HOMEBREW_TAP_TOKEN            (optional) token allowed to run workflows in DigitalTolk/homebrew-tools;
#                                 without it the tap's 6-hourly check picks the release up
#
# Release:  bump the version in src-tauri/tauri.conf.json, commit, then
#           git tag v0.1.2 && git push origin v0.1.2
name: release

on:
  push:
    tags: ["v*.*.*"]
  # Manual runs are a dry run (build + sign + notarize, DMG and Linux packages as workflow artifacts) unless
  # "publish" is ticked: a re-uploaded DMG would no longer match the Homebrew cask's sha256.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release and update Homebrew
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      KEYCHAIN: lotr-release.keychain-db
      OUT_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check required secrets
        env:
          P12: ${{ secrets.MAC_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          missing=()
          for v in P12 P12_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD / APPLE_*)"
            exit 1
          fi

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          [ "$app" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.MAC_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::No 'Developer ID Application' identity in MAC_CSC_LINK"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build, sign, notarize, staple (universal DMG)
        run: scripts/release-macos.sh

      - name: Publish GitHub release and update Homebrew
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          DMG="$OUT_DIR/LordOfTheRows-$VERSION-universal.dmg" TAP_TOKEN="$TAP_TOKEN" scripts/publish-homebrew.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lord-of-the-rows-macos-universal
          path: dist/*.dmg

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  linux:
    # Ubuntu 22.04 (glibc 2.35): the oldest supported distro, so the binaries run on it and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Runs npm / cargo build scripts: no write token here (only linux-publish needs one).
    permissions:
      contents: read
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      OUT_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          [ "$app" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1; }

      - name: System deps (Tauri / WebKitGTK, AppImage tooling)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config file libfuse2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build AppImage, .deb, .rpm (+ update signatures)
        run: scripts/release-linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lord-of-the-rows-linux-x86_64
          path: |
            dist/LordOfTheRows-*
            dist/latest-linux.json

  linux-publish:
    # After the macOS job, which creates the release and its latest.json. Runs even if a later
    # macOS step failed after publishing; publish-linux.sh stops if there is no release yet.
    needs: [macos, linux]
    if: always() && needs.linux.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lord-of-the-rows-linux-x86_64
          path: dist
      - name: Add the Linux packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: scripts/publish-linux.sh
